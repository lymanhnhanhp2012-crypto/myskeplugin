name: Build TShock Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Build Plugin
      run: dotnet build Plugin.csproj -c Release

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: SkeletronPhase2Plugin
        path: bin/Release/net6.0/*.dll
