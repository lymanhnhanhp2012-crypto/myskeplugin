name: Build TShock Plugin

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Create Csproj
      run: |
        dotnet new classlib -n Plugin
        rm Plugin/Class1.cs
        cp Plugin.cs Plugin/

    - name: Add TShock Package
      run: |
        cd Plugin
        dotnet add package TShock --version 5.2.0

    - name: Build
      run: |
        cd Plugin
        dotnet build -c Release

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: SkeletronPhase2Plugin
        path: Plugin/bin/Release/net6.0/*.dll

